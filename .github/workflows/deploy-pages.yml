# Builds the lab and publishes it to GitHub Pages: https://ajnesttheseries.github.io/silabsim01/
# The built site is pushed to the gh-pages branch; Pages serves that branch
# (Settings → Pages → Source: "Deploy from a branch", branch gh-pages / root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: write # push the built site to gh-pages

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # optional: set these under Settings → Secrets and variables → Actions → Variables
          VITE_STAFF_PIN: ${{ vars.VITE_STAFF_PIN }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - run: touch dist/.nojekyll # serve files as-is (no Jekyll processing)
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          single-commit: true
